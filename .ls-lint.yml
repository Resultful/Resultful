# .ls-lint.yml — file and directory naming, checked in CI (lint job).
# Scripts are C# file-based apps (`dotnet run eng/<name>.cs`): shell and PowerShell scripts are banned,
# as in the rest of the estate. Exceptions must be listed under `ignore:`.

ls:
  .sh: exists:0
  .bash: exists:0
  .zsh: exists:0
  .ps1: exists:0
  .psm1: exists:0
  .py: exists:0
  .md: regex:[A-Z][A-Z_]*      # README, AGENTS, RELEASE_NOTES
  "**":
    .sh: exists:0
    .bash: exists:0
    .zsh: exists:0
    .ps1: exists:0
    .psm1: exists:0
    .py: exists:0

  # Projects live under src/, tests/ and samples/ (benchmarks/ later). PascalCase files and folders;
  # partial files use dotted segments (Result.ErrorList.cs, ResultExtensions.Composition.Async.cs).
  # The ls-lint action also applies `.dir` to the matched folder itself, hence the (src|tests|samples) alternative.
  "{src,tests,samples}":
    .dir: regex:Resultful(\.[A-Z][A-Za-z0-9]*)* | regex:(src|tests|samples)
    .props: regex:Directory\.Build
  "{src,tests,samples}/**":
    .dir: PascalCase | regex:LINQ | regex:Resultful(\.[A-Z][A-Za-z0-9]*)* | regex:(src|tests|samples)
    .cs: regex:[A-Z][A-Za-z0-9]*(\.[A-Z][A-Za-z0-9]*)*
    .csproj: regex:Resultful(\.[A-Z][A-Za-z0-9]*)*

  eng:
    .cs: kebab-case
    .*: exists:0

  docs:
    .dir: kebab-case
    .md: kebab-case
  "docs/**":
    .dir: kebab-case
    .md: kebab-case

ignore:
  - .git
  - .vs
  - .idea
  # 04d (the Shop and the end-to-end oracle): use case folders named by ledger ID (UC01), the generator's
  # stand-in output, the broken consumers (each project named after the mistake it makes) and check-snippets.cs (a
  # file-based app that moves to eng/ at wiring). Kept apart from 04c's entries below so the branches merge cleanly.
  - samples/*/UC*
  - samples/*/GeneratorStandIn
  - tests/Resultful.EndToEnd/Broken
  - tests/Resultful.EndToEnd/Snippets/check-snippets.cs
  - temp
  - .temp
  - artifacts
  - TestResults
  - "**/bin"
  - "**/obj"
  # 04c (spec harness and target API). ls-lint's "**" rules above can't be overridden per folder, so these exact
  # paths are left out: fixture folders named by capability ID (CORE-NAMED) with lib/ and lib.v2/, per-target
  # PublicAPI folders (api/<target>/, or PublicAPI/<target>/ on branches cut before the 04c review) and the frozen
  # baseline-0.2.0/, and check-api.cs, a file-based app that moves to eng/ at wiring.
  - tests/Resultful.Spec/Fixtures
  - tests/Resultful.TargetApi/*/api
  - tests/Resultful.TargetApi/*/PublicAPI
  - tests/Resultful.TargetApi/baseline-0.2.0
  - tests/Resultful.TargetApi/check-api.cs
