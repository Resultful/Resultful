openapi: 3.1.0
info:
  title: Payments
  version: 1.0.0
  description: >
    Charges, created the way Stripe's API takes them: as a form (application/x-www-form-urlencoded), nested values in
    brackets (card[number], metadata[order], expand[0]), numbers and true or false as text; answered as JSON.
paths:
  /charges:
    get:
      operationId: listCharges
      description: Charges, filtered as Stripe filters them, by a deep-object range (created[gte]=1700000000).
      parameters:
        - name: created
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: false
            properties:
              gt: { type: integer, format: int64, minimum: 0 }
              gte: { type: integer, format: int64, minimum: 0 }
              lt: { type: integer, format: int64, minimum: 0 }
              lte: { type: integer, format: int64, minimum: 0 }
        - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: The charges
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Charge' } }
        '400':
          description: The filter is invalid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HttpValidationProblemDetails' }
    post:
      operationId: createCharge
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/NewCharge' }
      responses:
        '200':
          description: The charge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
          links:
            GetCharge: { operationId: getCharge, parameters: { chargeId: $response.body#/id } }
        '400':
          description: The charge is invalid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HttpValidationProblemDetails' }
        '415':
          description: The body isn't a form
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        default:
          description: Any other error, as Stripe describes them (a declined card is a 402)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /charges/{chargeId}:
    get:
      operationId: getCharge
      parameters:
        - { name: chargeId, in: path, required: true, schema: { type: string, pattern: '^ch_[0-9]+$', maxLength: 30, example: ch_1 } }
      responses:
        '200':
          description: The charge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
        '400':
          description: The id is invalid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HttpValidationProblemDetails' }
        '404':
          description: No such charge
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /charges/{chargeId}/receipt:
    get:
      operationId: getReceipt
      description: Where the charge's receipt is, as a redirect to it.
      parameters:
        - { name: chargeId, in: path, required: true, schema: { type: string, pattern: '^ch_[0-9]+$', maxLength: 30, example: ch_1 } }
      responses:
        '302':
          description: The receipt is at the Location
          headers:
            Location: { required: true, schema: { type: string, format: uri } }
        '400':
          description: The id is invalid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HttpValidationProblemDetails' }
        '404':
          description: No such charge
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
components:
  schemas:
    Currency:
      type: string
      enum: [usd, eur, gbp]
    Card:
      type: object
      required: [number, exp_month, exp_year]
      additionalProperties: false
      properties:
        number: { type: string, pattern: '^[0-9]{12,19}$', example: '4242424242424242' }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2000, maximum: 2100 }
    NewCharge:
      type: object
      required: [amount, currency, card]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 50, maximum: 99999999 }
        currency: { $ref: '#/components/schemas/Currency' }
        capture: { type: boolean }
        description: { type: string, maxLength: 100 }
        card: { $ref: '#/components/schemas/Card' }
        metadata:
          type: object
          additionalProperties: { type: string, maxLength: 50 }
        expand:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 20 }
    Charge:
      type: object
      required: [id, amount, currency, captured, last4, created]
      properties:
        id: { type: string, pattern: '^ch_[0-9]+$', example: ch_1 }
        created: { type: integer, format: int64, description: When it was created, in seconds since 1970 }
        amount: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        captured: { type: boolean }
        description: { type: [string, 'null'] }
        last4: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [card_error, invalid_request_error, api_error] }
        message: { type: string }
        code: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        status: { type: [integer, 'null'], format: int32 }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
    HttpValidationProblemDetails:
      type: object
      properties:
        type: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        status: { type: [integer, 'null'], format: int32 }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
