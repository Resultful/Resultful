overlay: 1.1.0
info: { title: Shelter rules, version: "1.0.0" }
extends: openapi-3.1.yaml
actions:
  - target: $.paths['/pets'].get.parameters[?(@.name == 'limit')].schema
    update: { default: 20 }
  - target: $.paths['/pets'].post
    update:
      x-matchmark-ensures:
        - condition: $response.body#/name == $request.body#/name
