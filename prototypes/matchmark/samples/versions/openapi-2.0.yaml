swagger: "2.0"
info: { title: Shelter, version: "1.0.0" }
consumes: [application/json]
produces: [application/json]
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - { name: limit, in: query, type: integer, minimum: 1, maximum: 50 }
      responses:
        "200": { description: The pets, schema: { type: array, items: { $ref: '#/definitions/Pet' } } }
    post:
      operationId: createPet
      parameters:
        - { name: pet, in: body, required: true, schema: { $ref: '#/definitions/NewPet' } }
      responses:
        "201": { description: Created, schema: { $ref: '#/definitions/Pet' } }
        "400": { description: Invalid }
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - { name: petId, in: path, required: true, type: integer, minimum: 1 }
      responses:
        "200": { description: The pet, schema: { $ref: '#/definitions/Pet' } }
        "404": { description: Not found }
definitions:
  NewPet:
    type: object
    required: [name]
    properties:
      name: { type: string, minLength: 1, maxLength: 40, example: Rex }
  Pet:
    type: object
    required: [id, name]
    properties:
      id: { type: integer, readOnly: true }
      name: { type: string, minLength: 1, maxLength: 40, example: Rex }
