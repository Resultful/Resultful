openapi: 3.2.0
info: { title: Shelter, version: "1.0.0" }
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: The pets
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } } }
    post:
      operationId: createPet
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewPet" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } }
        "400":
          description: Invalid
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/HttpValidationProblemDetails" } } }
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The pet
          content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } }
        "404": { description: Not found }
  /pets/search:
    query:
      operationId: searchPets
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string, maxLength: 40 } } }
      responses:
        "200":
          description: Matching pets
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } } }
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, example: Rex }
        tag: { type: [string, 'null'] }
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 40, example: Rex }
        tag: { type: [string, 'null'] }
    HttpValidationProblemDetails:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
