asyncapi: 3.1.0
info: { title: Shelter events, version: "1.0.0" }
defaultContentType: application/json
channels:
  adoptions:
    address: pets.adopted
    messages:
      adoption: { $ref: '#/components/messages/Adoption' }
operations:
  receiveAdoption:
    action: receive
    channel: { $ref: '#/channels/adoptions' }
  publishAdoption:
    action: send
    channel: { $ref: '#/channels/adoptions' }
components:
  messages:
    Adoption:
      name: adoption
      payload: { $ref: '#/components/schemas/Adoption' }
  schemas:
    Adoption:
      type: object
      required: [petId, adopter]
      properties:
        petId: { type: integer, minimum: 1 }
        adopter: { type: string, minLength: 1, maxLength: 80 }
