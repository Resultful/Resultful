openapi: 3.1.0
info:
  title: Pet Store
  version: 1.0.0
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: The request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '409':
          description: A pet with that name already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: No such pet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: upsertPet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '200':
          description: Replaced an existing pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '201':
          description: Created a new pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: The request failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
    delete:
      operationId: deletePet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: No such pet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    Pet:
      type: object
      required: [id, name, status, details]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        tag:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PetStatus'
        details:
          $ref: '#/components/schemas/PetDetails'
    NewPet:
      type: object
      required: [name, details]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        tag:
          type: [string, 'null']
          pattern: '^[a-z-]+$'
        details:
          $ref: '#/components/schemas/PetDetails'
    PetStatus:
      type: string
      enum: [available, adopted]
    PetDetails:
      oneOf:
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Cat'
      discriminator:
        propertyName: kind
        mapping:
          dog: '#/components/schemas/Dog'
          cat: '#/components/schemas/Cat'
    Dog:
      type: object
      required: [kind, goodBoy]
      properties:
        kind:
          type: string
        goodBoy:
          type: boolean
    Cat:
      type: object
      required: [kind, livesLeft]
      properties:
        kind:
          type: string
        livesLeft:
          type: integer
          format: int32
          minimum: 0
          maximum: 9
    ProblemDetails:
      type: object
      properties:
        type:
          type: [string, 'null']
        title:
          type: [string, 'null']
        status:
          type: [integer, 'null']
          format: int32
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type: [string, 'null']
        title:
          type: [string, 'null']
        status:
          type: [integer, 'null']
          format: int32
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
