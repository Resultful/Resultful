# Keeps the SHA-pinned actions and NuGet packages current. Each `uses:` is a 40-char commit SHA with a
# `# vX.Y.Z` comment; Dependabot bumps both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: [ "*" ]
    commit-message:
      prefix: ci
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      test-packages:
        patterns: [ "NUnit*", "Microsoft.NET.Test.Sdk", "FluentAssertions*", "NunitXml.TestLogger" ]
    commit-message:
      prefix: build
