name: release

# Publishing is a manual run of this workflow (decisions 22 and 23). Give the packages to release and their versions,
# e.g. `Resultful=0.2.0-beta07` (or JSON {"Resultful":"0.2.0-beta07"}); versions are never committed. A dry run (the
# default) plans, checks and packs without publishing, on any branch. A real run publishes from main only, and only a
# commit whose `ci` check passed. It drafts a GitHub Release per package at the run's commit, then stages the packages
# on nuget.org: they go public only when promoted there (signed in with 2FA). Once a version is public, finalize.yml
# publishes its draft, which tags it. If a run fails part way, use "Re-run failed jobs".
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages and versions, e.g. Resultful=0.2.0 (no "v")'
        type: string
        required: true
      dry_run:
        description: Plan, check and pack only; publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Validates the map against .github/release-packages.json, nuget.org and the tags (eng/build.cs, ReleasePlan).
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags and history, for collisions and the release notes
          fetch-tags: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # eng/build.cs runs on net10.0

      - name: Plan the release
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: dotnet run eng/build.cs -- --target=ReleasePlan

  # The commit must have passed ci.yml's `ci` gate. A dry run only warns, so any branch can be tried.
  verify_ci:
    name: verify_ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.dry_run }}
    permissions:
      checks: read
    steps:
      - name: The ci check passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci&filter=latest" --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "::error::the ci check hasn't passed on $SHA; wait for ci.yml on main, then run again."; exit 1; }

  # Stamps the planned versions (release-versions.props, never committed), packs, verifies, and smoke-tests.
  pack:
    name: pack
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # SourceLink and the package's repository commit

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Write release-versions.props
        run: dotnet run eng/build.cs -- --target=ReleaseProps

      - name: Build, pack and verify (Cake)
        run: dotnet run eng/build.cs -- --target=Pack --ci=true --artifacts=artifacts/Resultful

      - name: Consumers restore and run the packed package (net8.0, net10.0, net11.0)
        run: dotnet run eng/build.cs -- --target=CompatNuGet --artifacts=artifacts/Resultful

      - name: A library built against 0.2.0-beta05 runs on the packed package
        run: dotnet run eng/build.cs -- --target=CompatUpgrade --artifacts=artifacts/Resultful

      # Last before the upload, so nothing after it can add a file that publish would push.
      - name: Exactly the planned packages were packed
        run: dotnet run eng/build.cs -- --target=ReleaseCheckArtifacts

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: artifacts
          if-no-files-found: error
          overwrite: true # "Re-run all jobs" packs again

  # One draft GitHub Release per package, at the run's commit, before anything is staged. The draft is the record of
  # what was staged from which commit; it creates no tag. finalize.yml publishes it once the version is on nuget.org,
  # and only then does GitHub create the tag <package>/v<version> at the draft's commit. No checkout.
  draft:
    name: draft
    needs: [ plan, verify_ci, pack ]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' && needs.verify_ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # draft releases (drafts are only visible to a token that can write)
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.plan_json) }}
    steps:
      # Any existing draft means a run already got this far, and may have staged the version: staging it again is
      # untested, so stop. GitHub would accept a second draft for the same tag without complaint.
      - name: Draft ${{ matrix.package.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ matrix.package.tag }}
          TITLE: ${{ matrix.package.package_id }} ${{ matrix.package.version }}
          NOTES: ${{ matrix.package.notes }}
          PRERELEASE: ${{ matrix.package.prerelease }}
        run: |
          set -euo pipefail
          releases_for_tag() { gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.target_commitish) (draft: \(.draft))"'; }
          existing=$(releases_for_tag | paste -sd ';' -)
          if [ -n "$existing" ]; then
            echo "::error::$TAG already has a release: $existing. Finalize or delete it (finalize.yml) before releasing again."
            exit 1
          fi
          read -r id created < <(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f target_commitish="$SHA" -f name="$TITLE" \
            -f body="$NOTES" -F draft=true -F prerelease="$PRERELEASE" --jq '"\(.id) \(.tag_name)"')
          [ "$created" = "$TAG" ] || { echo "::error::GitHub created the draft as $created, not $TAG."; exit 1; }

          # The release list lags a new draft by seconds, so the check above can miss one made at the same time. Wait
          # until this draft is listed, then this must be the tag's only release; if not, take this one back.
          for _ in $(seq 1 12); do
            listed=$(releases_for_tag)
            grep -q "^$id " <<<"$listed" && break
            sleep 5
          done
          grep -q "^$id " <<<"$listed" || { echo "::error::the draft $id for $TAG never appeared in the release list."; exit 1; }
          if [ "$(wc -l <<<"$listed")" -ne 1 ]; then
            gh api -X DELETE "repos/$REPO/releases/$id"
            echo "::error::$TAG has more than one release ($(paste -sd ';' - <<<"$listed")); deleted this run's draft $id."
            exit 1
          fi
          echo "- Drafted \`$TAG\` at \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # No checkout, no repository code: only the packed artifact and a short-lived NuGet key. Stages, never publishes.
  publish:
    name: publish
    needs: [ plan, verify_ci, pack, draft ]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' && needs.verify_ci.result == 'success' && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # NuGet trusted publishing: an OIDC token, exchanged for a key that lasts an hour
    environment: release
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.100' # the first SDK with `dotnet package stage push`

      # nuget.org's trusted publishing policy for Resultful names this repository, release.yml and the release
      # environment, and may only stage. No long-lived key is stored anywhere.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER || 'rtk_13' }} # the nuget.org account that owns the policy

      # Each .nupkg's sibling .snupkg is staged with it. The key is read from NUGET_API_KEY, never the command line.
      - name: Stage on NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s globstar
          for pkg in artifacts/**/*.nupkg; do
            dotnet package stage push "$pkg" --source https://api.nuget.org/v3/index.json
            echo "- Staged \`$(basename "$pkg")\`: promote it on nuget.org; finalize.yml then publishes its draft release." >> "$GITHUB_STEP_SUMMARY"
          done
