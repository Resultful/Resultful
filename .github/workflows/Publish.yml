name: CI & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Resultful.sln

      - name: Build solution
        run: dotnet build Resultful.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Resultful.sln --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack Resultful/Resultful.csproj --configuration Release --no-build -o nupkg

      - name: Publish to NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NUGET_AUTH_TOKEN != ''
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY || secrets.NUGET_KEY || secrets.NUGET_TOKEN }}
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_AUTH_TOKEN" --source https://api.nuget.org/v3/index.json --skip-duplicate
