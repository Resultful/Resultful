name: ci

on:
  push:
    branches: [ main ]
  pull_request: # any base branch, so stacked pull requests are checked too
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packed packages to nuget.org
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # `build` is the check main's branch protection requires; keep the name.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # SourceLink and the package's repository commit

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 test target

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', 'eng/build.cs') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build, test, pack, and verify (Cake)
        run: dotnet run eng/build.cs -- --target=CI --ci=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts
          if-no-files-found: error

  compatibility:
    name: compatibility (NuGet + Paket)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts

      - name: Consumers (NuGet, net8.0, net10.0, net11.0)
        run: dotnet run eng/build.cs -- --target=CompatNuGet

      - name: Library built against 0.2.0-beta05, app on the packed package (net8.0, net10.0)
        run: dotnet run eng/build.cs -- --target=CompatUpgrade

      - name: Consumers (Paket, strategy min)
        working-directory: tests/Compatibility/Paket
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/packages-paket
        run: |
          set -euo pipefail
          version=$(basename ../../../artifacts/Resultful.[0-9]*.nupkg .nupkg); version=${version#Resultful.}
          sed -i "s/^nuget Resultful = .*/nuget Resultful = $version/" paket.dependencies
          grep -qx "nuget Resultful = $version" paket.dependencies
          dotnet tool install paket --version 12.0.0 --tool-path "$RUNNER_TEMP/paket"
          "$RUNNER_TEMP/paket/paket" clear-cache
          "$RUNNER_TEMP/paket/paket" install --force
          cat paket.lock
          found=$(awk '/^  remote: /{remote=$2} /^    [^ ]+ \(/{sub(/^ +/, ""); print remote " | " $0}' paket.lock | sort)
          expected=$(printf '%s\n' "https://api.nuget.org/v3/index.json | OneOf (3.0.271)" "../../../artifacts | Resultful ($version)" | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::paket.lock resolved:"$'\n'"$found"$'\n'"expected:"$'\n'"$expected"
            exit 1
          fi

  compatibility-net481:
    name: compatibility (net481)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts

      - name: Consumer (net481)
        run: dotnet run eng/build.cs -- --target=CompatNet481

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check file names (ls-lint)
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Audit workflows (zizmor)
        run: uvx zizmor@1.31.1 --offline --format github .

  # Publishing is manual: run the workflow on main with `publish` ticked. Merging never publishes.
  # Lockstep (decision 11): every package shares one version, and the run's commit is tagged v<version>.
  publish:
    name: publish
    needs: [ build, lint, compatibility, compatibility-net481 ]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release tag
      id-token: write # NuGet trusted publishing: an OIDC token, exchanged for a short-lived API key
    environment: release
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Trusted publishing: nuget.org's policy for Resultful trusts this repo, ci.yml and the release environment,
      # and gives a key that lasts an hour. No long-lived key is stored anywhere.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: rtk_13 # the nuget.org account that owns the trusted publishing policy

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cores=(artifacts/Resultful.[0-9]*.nupkg)
          if [ "${#cores[@]}" -ne 1 ]; then
            echo "::error::expected one Resultful.<version>.nupkg, found ${#cores[@]}; nothing was tagged."
            exit 1
          fi
          version=$(basename "${cores[0]}" .nupkg)
          tag="v${version#Resultful.}"
          existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
            echo "Tagged $tag at $SHA."
          elif [ "$existing" = "$SHA" ]; then
            echo "$tag already points at $SHA."
          else
            echo "::error::$tag already points at $existing, not $SHA."
            exit 1
          fi
