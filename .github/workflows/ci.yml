name: ci

on:
  push:
    branches: [ main ]
  pull_request: # any base branch, so stacked pull requests are checked too
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Job names are short snake_case so branch protection can name them; main requires only `ci`, the gate at the end.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # SourceLink and the package's repository commit

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 test target

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', 'eng/build.cs') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build, test, pack, and verify (Cake)
        run: dotnet run eng/build.cs -- --target=CI --ci=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts
          if-no-files-found: error

  # Consumers on NuGet (and the beta05 upgrade) and Paket.
  compat:
    name: compat
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Consumers (NuGet, net8.0, net10.0, net11.0)
        run: dotnet run eng/build.cs -- --target=CompatNuGet

      - name: Library built against 0.2.0-beta05, app on the packed package (net8.0, net10.0)
        run: dotnet run eng/build.cs -- --target=CompatUpgrade

      - name: Consumers (Paket, strategy min)
        working-directory: tests/Compatibility/Paket
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/packages-paket
        run: |
          set -euo pipefail
          version=$(basename ../../../artifacts/Resultful.[0-9]*.nupkg .nupkg); version=${version#Resultful.}
          sed -i "s/^nuget Resultful = .*/nuget Resultful = $version/" paket.dependencies
          grep -qx "nuget Resultful = $version" paket.dependencies
          dotnet tool install paket --version 12.0.0 --tool-path "$RUNNER_TEMP/paket"
          "$RUNNER_TEMP/paket/paket" clear-cache
          "$RUNNER_TEMP/paket/paket" install --force
          cat paket.lock
          found=$(awk '/^  remote: /{remote=$2} /^    [^ ]+ \(/{sub(/^ +/, ""); print remote " | " $0}' paket.lock | sort)
          expected=$(printf '%s\n' "https://api.nuget.org/v3/index.json | OneOf (3.0.271)" "../../../artifacts | Resultful ($version)" | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::paket.lock resolved:"$'\n'"$found"$'\n'"expected:"$'\n'"$expected"
            exit 1
          fi

  compat_net481:
    name: compat_net481
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Consumer (net481)
        run: dotnet run eng/build.cs -- --target=CompatNet481

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check file names (ls-lint)
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Audit workflows (zizmor)
        run: uvx zizmor@1.31.1 --offline --format github .

  # The one required check: passes only if every job above passed. New jobs go in its `needs`, not in branch protection.
  # release.yml publishes only a commit whose `ci` check passed (decision 22); this workflow never publishes.
  ci:
    name: ci
    if: always()
    needs: [ build, compat, compat_net481, lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::every job must pass; results: $RESULTS"
              exit 1
            fi
          done
